<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strichmännchen Abenteuer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #fff;
      user-select: none;
    }
    #hud {
      display: flex;
      gap: 30px;
      margin-bottom: 10px;
      font-size: 16px;
      background: rgba(255,255,255,0.08);
      padding: 8px 24px;
      border-radius: 20px;
    }
    #hud span { display: flex; align-items: center; gap: 6px; }
    #hud .label { opacity: 0.7; font-size: 13px; }
    #hud .val { font-weight: bold; font-size: 18px; }
    canvas {
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      display: block;
      box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }
    #controls {
      margin-top: 10px;
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      display: flex;
      gap: 20px;
    }
    #controls kbd {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="hud">
    <span><span class="label">Level</span><span class="val" id="lvlDisplay">1</span></span>
    <span><span class="label">Leben</span><span class="val" id="livesDisplay">❤❤❤</span></span>
    <span><span class="label">Zeit</span><span class="val" id="timerDisplay">60</span><span class="label">s</span></span>
  </div>
  <canvas id="c" width="800" height="480"></canvas>
  <div id="controls">
    <span><kbd>←</kbd><kbd>→</kbd> Bewegen</span>
    <span><kbd>↑</kbd> / <kbd>Leertaste</kbd> Springen</span>
    <span><kbd>R</kbd> Neustart</span>
  </div>

  <script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // ─── Constants ─────────────────────────────────────────────
  const GRAVITY    = 0.55;
  const MAX_FALL   = 16;
  const JUMP       = -13;
  const SPEED      = 4.2;
  const FRICTION   = 0.78;

  // ─── Input ─────────────────────────────────────────────────
  const keys = {};
  document.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['Space','ArrowUp','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
    if (e.code === 'KeyR') restartGame();
  });
  document.addEventListener('keyup',  e => { keys[e.code] = false; });

  // ─── Game state ────────────────────────────────────────────
  let state        = 'playing'; // playing | dead | nextLevel | gameOver | win
  let currentLevel = 1;
  let lives        = 3;
  let timer        = 60;
  let timerInterval;
  let particles    = [];

  // ─── Player ────────────────────────────────────────────────
  const PW = 22, PH = 42;
  const player = { x:0, y:0, vx:0, vy:0, onGround:false, facing:1, step:0, stepTimer:0, dead:false };

  // ─── Level data ────────────────────────────────────────────
  // Each level: bg sky/ground colours, platforms, spikes, enemies, movingPlatforms, goal, start
  const LEVELS = [
    /* 1 – Introduction */ {
      time: 60,
      sky:  ['#6EC6FF','#b8e4ff'],
      platforms: [
        {x:0,   y:440, w:800, h:40, c:'#4a7c4e'},  // ground
        {x:190, y:340, w:110, h:14, c:'#5d4037'},
        {x:380, y:270, w:110, h:14, c:'#5d4037'},
        {x:570, y:340, w:110, h:14, c:'#5d4037'},
      ],
      spikes: [],
      enemies: [],
      movingPlatforms: [],
      goal:  {x:750, y:310, w:24, h:130},
      start: {x:40,  y:395},
    },

    /* 2 – Moving Platforms */ {
      time: 50,
      sky:  ['#FFB347','#FFCC70'],
      platforms: [
        {x:0,   y:440, w:160, h:40, c:'#795548'},
        {x:620, y:440, w:180, h:40, c:'#795548'},
        {x:260, y:350, w: 80, h:14, c:'#795548'},
      ],
      spikes: [
        {x:162, y:430, n:5},
        {x:470, y:430, n:4},
      ],
      enemies: [],
      movingPlatforms: [
        {x:180, y:295, w:80, h:14, vx: 1.8, minX:160, maxX:380, vy:0, minY:0, maxY:0, c:'#e65100'},
        {x:440, y:200, w:80, h:14, vx:-1.8, minX:370, maxX:580, vy:0, minY:0, maxY:0, c:'#e65100'},
      ],
      goal:  {x:755, y:310, w:24, h:130},
      start: {x:40,  y:395},
    },

    /* 3 – Enemies */ {
      time: 45,
      sky:  ['#EF5350','#B71C1C'],
      platforms: [
        {x:0,   y:440, w:800, h:40, c:'#3e2723'},
        {x:140, y:355, w:100, h:14, c:'#4e342e'},
        {x:330, y:275, w:100, h:14, c:'#4e342e'},
        {x:510, y:195, w:100, h:14, c:'#4e342e'},
        {x:650, y:295, w:100, h:14, c:'#4e342e'},
      ],
      spikes: [
        {x: 90, y:430, n:2},
        {x:248, y:430, n:2},
        {x:440, y:430, n:2},
        {x:590, y:430, n:2},
      ],
      enemies: [
        {x:160, y:410, w:26, h:30, vx:1.4, minX:120, maxX:280, alive:true},
        {x:520, y:160, w:26, h:30, vx:1.8, minX:510, maxX:605, alive:true},
      ],
      movingPlatforms: [],
      goal:  {x:757, y:265, w:24, h:175},
      start: {x:30,  y:395},
    },

    /* 4 – Everything mixed */ {
      time: 40,
      sky:  ['#7B1FA2','#1A237E'],
      platforms: [
        {x:0,   y:440, w:120, h:40, c:'#1a1a2e'},
        {x:680, y:440, w:120, h:40, c:'#1a1a2e'},
        {x:240, y:375, w: 80, h:14, c:'#2d2b55'},
        {x:430, y:295, w: 80, h:14, c:'#2d2b55'},
      ],
      spikes: [
        {x:120, y:430, n:3},
        {x:345, y:430, n:3},
        {x:530, y:430, n:3},
      ],
      enemies: [
        {x:250, y:340, w:26, h:30, vx: 2.0, minX:240, maxX:390, alive:true},
        {x:550, y:410, w:26, h:30, vx:-2.0, minX:450, maxX:678, alive:true},
      ],
      movingPlatforms: [
        {x:360, y:220, w:80, h:14, vx: 2.2, minX:300, maxX:530, vy:0, minY:0, maxY:0, c:'#6a1b9a'},
        {x:540, y:160, w:80, h:14, vx: 0,   minX:0,   maxX:0,   vy:1.8, minY:130, maxY:330, c:'#6a1b9a'},
      ],
      goal:  {x:757, y:310, w:24, h:130},
      start: {x:30,  y:395},
    },

    /* 5 – Gauntlet */ {
      time: 35,
      sky:  ['#212121','#0a0a0a'],
      platforms: [
        {x:0,   y:440, w: 90, h:40, c:'#111'},
        {x:710, y:440, w: 90, h:40, c:'#111'},
        {x:180, y:370, w: 70, h:14, c:'#222'},
        {x:360, y:295, w: 70, h:14, c:'#222'},
        {x:530, y:355, w: 70, h:14, c:'#222'},
      ],
      spikes: [
        {x: 90, y:430, n:3},
        {x:270, y:430, n:3},
        {x:450, y:430, n:3},
        {x:625, y:430, n:3},
      ],
      enemies: [
        {x:200, y:335, w:26, h:30, vx: 2.8, minX:182, maxX:336, alive:true},
        {x:380, y:260, w:26, h:30, vx: 2.4, minX:362, maxX:494, alive:true},
        {x:540, y:320, w:26, h:30, vx:-2.8, minX:450, maxX:598, alive:true},
      ],
      movingPlatforms: [
        {x:100,  y:260, w:70, h:14, vx:2.4, minX:90,  maxX:280, vy:0, minY:0,   maxY:0,   c:'#444'},
        {x:490,  y:180, w:70, h:14, vx:0,   minX:0,   maxX:0,   vy:2.2, minY:130, maxY:330, c:'#444'},
        {x:590,  y:230, w:70, h:14, vx:-2,  minX:460, maxX:695, vy:0, minY:0,   maxY:0,   c:'#444'},
      ],
      goal:  {x:757, y:310, w:24, h:130},
      start: {x:20,  y:395},
    },
  ];

  // ─── Working copies (modified at runtime) ──────────────────
  let levelEnemies    = [];
  let levelMovPlats   = [];
  let levelData       = null;

  // ─── Helpers ───────────────────────────────────────────────
  function overlap(ax,ay,aw,ah, bx,by,bw,bh){
    return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by;
  }

  function spawnParticles(x, y, color, n) {
    for (let i=0; i<n; i++) {
      const angle = Math.random()*Math.PI*2;
      const speed = 1+Math.random()*4;
      particles.push({x, y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed, life:30+Math.random()*20, color});
    }
  }

  // ─── Init / Restart ────────────────────────────────────────
  function initLevel(n) {
    const lvl = LEVELS[n-1];
    levelData      = lvl;
    levelEnemies   = lvl.enemies.map(e => ({...e}));
    levelMovPlats  = lvl.movingPlatforms.map(p => ({...p}));
    particles      = [];

    player.x       = lvl.start.x;
    player.y       = lvl.start.y;
    player.vx      = 0;
    player.vy      = 0;
    player.onGround= false;
    player.dead    = false;
    player.facing  = 1;
    player.step    = 0;

    clearInterval(timerInterval);
    timer = lvl.time;
    updateHUD();

    timerInterval = setInterval(() => {
      if (state === 'playing') {
        timer--;
        updateHUD();
        if (timer <= 0) die();
      }
    }, 1000);

    state = 'playing';
  }

  function restartGame() {
    currentLevel = 1;
    lives        = 3;
    initLevel(1);
  }

  // ─── HUD ───────────────────────────────────────────────────
  function updateHUD() {
    document.getElementById('lvlDisplay').textContent   = currentLevel;
    document.getElementById('livesDisplay').textContent = '❤'.repeat(lives) + '♡'.repeat(Math.max(0,3-lives));
    document.getElementById('timerDisplay').textContent  = timer;
  }

  // ─── Death / next level ────────────────────────────────────
  function die() {
    if (player.dead) return;
    player.dead = true;
    lives--;
    updateHUD();
    spawnParticles(player.x + PW/2, player.y + PH/2, '#ff4444', 18);
    state = lives <= 0 ? 'gameOver' : 'dead';
    clearInterval(timerInterval);
    if (state === 'dead') setTimeout(() => initLevel(currentLevel), 1800);
  }

  function completeLevel() {
    clearInterval(timerInterval);
    spawnParticles(levelData.goal.x+12, levelData.goal.y + 40, '#FFD700', 30);
    state = 'nextLevel';
    setTimeout(() => {
      if (currentLevel >= LEVELS.length) { state = 'win'; return; }
      currentLevel++;
      initLevel(currentLevel);
    }, 2000);
  }

  // ─── Spike geometry ────────────────────────────────────────
  // Each spike entry: {x, y, n} → n triangles, each 18px wide, 20px tall
  const SW = 18, SH = 20;

  function spikeHitboxes(s) {
    const boxes = [];
    for (let i=0; i<s.n; i++) {
      boxes.push({x: s.x + i*SW, y: s.y - SH, w: SW, h: SH});
    }
    return boxes;
  }

  // ─── Update ────────────────────────────────────────────────
  function update() {
    if (state !== 'playing') return;

    const lvl = levelData;

    // Player horizontal
    if (keys['ArrowLeft']  || keys['KeyA']) { player.vx = -SPEED; player.facing = -1; }
    else if (keys['ArrowRight'] || keys['KeyD']) { player.vx =  SPEED; player.facing =  1; }
    else { player.vx *= FRICTION; }

    // Jump
    if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && player.onGround) {
      player.vy = JUMP;
      player.onGround = false;
    }

    // Gravity
    player.vy = Math.min(player.vy + GRAVITY, MAX_FALL);

    // Move
    player.x += player.vx;
    player.y += player.vy;

    // Walk animation
    if (player.onGround && Math.abs(player.vx) > 0.5) {
      player.stepTimer++;
      if (player.stepTimer > 7) { player.stepTimer = 0; player.step = (player.step+1)%4; }
    } else if (!player.onGround) {
      player.step = 1;
    } else {
      player.step = 0;
    }

    // Update moving platforms (carry player if standing on one)
    let onMoving = null;
    for (const p of levelMovPlats) {
      const prevX = p.x, prevY = p.y;
      if (p.vx) { p.x += p.vx; if (p.x<=p.minX||p.x+p.w>=p.maxX) p.vx=-p.vx; }
      if (p.vy) { p.y += p.vy; if (p.y<=p.minY||p.y+p.h>=p.maxY) p.vy=-p.vy; }
      // Carry
      if (player.onGround &&
          player.x+PW > p.x && player.x < p.x+p.w &&
          Math.abs((player.y+PH) - prevY) < 4) {
        player.x += p.x - prevX;
        player.y += p.y - prevY;
        onMoving = p;
      }
    }

    // Platform collision
    player.onGround = false;
    const allPlats = [...lvl.platforms, ...levelMovPlats];
    for (const p of allPlats) {
      if (!overlap(player.x, player.y, PW, PH, p.x, p.y, p.w, p.h)) continue;
      const ol = (player.x+PW) - p.x;
      const or_ = (p.x+p.w) - player.x;
      const ot = (player.y+PH) - p.y;
      const ob = (p.y+p.h) - player.y;
      const min = Math.min(ol,or_,ot,ob);
      if (min===ot && player.vy>=0)  { player.y = p.y-PH;   player.vy=0; player.onGround=true; }
      else if (min===ob && player.vy<0) { player.y = p.y+p.h; player.vy=0; }
      else if (min===ol) { player.x = p.x-PW; player.vx=0; }
      else               { player.x = p.x+p.w; player.vx=0; }
    }

    // Clamp to canvas width
    if (player.x < 0)      { player.x=0; player.vx=0; }
    if (player.x+PW > W)   { player.x=W-PW; player.vx=0; }

    // Spike collision
    for (const s of lvl.spikes) {
      for (const hb of spikeHitboxes(s)) {
        if (overlap(player.x+3, player.y+4, PW-6, PH-4, hb.x, hb.y, hb.w, hb.h)) { die(); break; }
      }
    }

    // Enemy update + collision
    for (const e of levelEnemies) {
      if (!e.alive) continue;
      e.x += e.vx;
      if (e.x<=e.minX||e.x+e.w>=e.maxX) e.vx=-e.vx;

      if (overlap(player.x+2, player.y+2, PW-4, PH-4, e.x, e.y, e.w, e.h)) {
        // Stomp from above kills enemy
        if (player.vy > 0 && player.y+PH < e.y + e.h*0.5+4) {
          e.alive = false;
          player.vy = JUMP * 0.55;
          spawnParticles(e.x+e.w/2, e.y+e.h/2, '#FF5722', 12);
        } else {
          die();
        }
      }
    }

    // Goal collision
    const g = lvl.goal;
    if (overlap(player.x, player.y, PW, PH, g.x, g.y, g.w, g.h)) completeLevel();

    // Fall out
    if (player.y > H+60) die();

    // Particles
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life--;
    }
    particles = particles.filter(p => p.life > 0);
  }

  // ─── Draw helpers ──────────────────────────────────────────
  function drawSky(lvl) {
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, lvl.sky[0]);
    g.addColorStop(1, lvl.sky[1]);
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  }

  function drawPlatform(p) {
    ctx.fillStyle = p.c || '#5d4037';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(p.x, p.y, p.w, 3);
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(p.x, p.y+p.h-3, p.w, 3);
  }

  function drawSpikes(s) {
    ctx.fillStyle = '#FF3333';
    for (let i=0; i<s.n; i++) {
      const bx = s.x + i*SW;
      ctx.beginPath();
      ctx.moveTo(bx, s.y);
      ctx.lineTo(bx+SW/2, s.y-SH);
      ctx.lineTo(bx+SW, s.y);
      ctx.closePath();
      ctx.fill();
    }
    // glint
    ctx.fillStyle = 'rgba(255,180,180,0.6)';
    for (let i=0; i<s.n; i++) {
      const bx = s.x + i*SW;
      ctx.beginPath();
      ctx.moveTo(bx+SW*0.35, s.y-SH*0.2);
      ctx.lineTo(bx+SW/2, s.y-SH+2);
      ctx.lineTo(bx+SW*0.55, s.y-SH*0.2);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawEnemy(e) {
    if (!e.alive) return;
    const cx = e.x + e.w/2;
    const top = e.y;

    // Body (red stick figure)
    ctx.strokeStyle = '#c0392b';
    ctx.lineWidth   = 2.5;
    ctx.lineCap     = 'round';

    // Head
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.arc(cx, top+7, 7, 0, Math.PI*2);
    ctx.fill();
    ctx.stroke();

    // Angry brows
    ctx.strokeStyle = '#7b0000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx-6,top+3); ctx.lineTo(cx-2,top+5);
    ctx.moveTo(cx+6,top+3); ctx.lineTo(cx+2,top+5);
    ctx.stroke();

    // Eyes
    ctx.fillStyle='#7b0000';
    ctx.beginPath();
    ctx.arc(cx-3,top+7,2,0,Math.PI*2);
    ctx.arc(cx+3,top+7,2,0,Math.PI*2);
    ctx.fill();

    // Body line
    ctx.strokeStyle = '#c0392b';
    ctx.lineWidth=2.5;
    ctx.beginPath();
    ctx.moveTo(cx,top+14); ctx.lineTo(cx,top+22);
    // arms
    ctx.moveTo(cx-9,top+17); ctx.lineTo(cx+9,top+17);
    // legs
    ctx.moveTo(cx,top+22); ctx.lineTo(cx-6,top+30);
    ctx.moveTo(cx,top+22); ctx.lineTo(cx+6,top+30);
    ctx.stroke();
  }

  function drawGoal(g) {
    // Glowing checkpoint pole
    const poleX = g.x+8;

    // Glow
    const grd = ctx.createRadialGradient(poleX, g.y+40, 0, poleX, g.y+40, 60);
    grd.addColorStop(0,'rgba(255,215,0,0.25)');
    grd.addColorStop(1,'rgba(255,215,0,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(g.x-50, g.y, g.w+100, g.h);

    // Pole
    ctx.strokeStyle='#ccc';
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(poleX, g.y+g.h); ctx.lineTo(poleX, g.y+10);
    ctx.stroke();

    // Flag (animated wave)
    const t = Date.now()/400;
    ctx.fillStyle='#FFD700';
    ctx.beginPath();
    ctx.moveTo(poleX, g.y+10);
    ctx.bezierCurveTo(poleX+15, g.y+15+Math.sin(t)*3, poleX+15, g.y+22+Math.sin(t+0.5)*3, poleX, g.y+30);
    ctx.fill();

    // Star
    ctx.fillStyle='#FF6600';
    ctx.font='bold 12px Arial';
    ctx.fillText('★', poleX+3, g.y+25);

    // "ZIEL" text
    ctx.fillStyle='rgba(255,215,0,0.85)';
    ctx.font='bold 11px Arial';
    ctx.textAlign='center';
    ctx.fillText('ZIEL', poleX, g.y+g.h+14);
    ctx.textAlign='left';
  }

  function drawStickFigure(px, py, step, facing, dead) {
    const cx = px + PW/2;
    const headR  = 9;
    const headCY = py + headR;
    const neck   = py + headR*2;
    const waist  = py + headR*2 + 14;
    const footY  = py + PH;

    // Shadow
    if (!dead) {
      ctx.fillStyle='rgba(0,0,0,0.15)';
      ctx.beginPath();
      ctx.ellipse(cx, py+PH+2, 9, 3, 0, 0, Math.PI*2);
      ctx.fill();
    }

    const swing = [-12,0,12,0][step] * (dead ? 0 : 1);

    ctx.lineCap   = 'round';
    ctx.lineJoin  = 'round';
    ctx.lineWidth = dead ? 2 : 2.5;
    ctx.strokeStyle = dead ? '#ff4444' : '#111';

    // Legs
    ctx.beginPath();
    ctx.moveTo(cx, waist);
    ctx.lineTo(cx - 8 + swing*0.7, footY);
    ctx.moveTo(cx, waist);
    ctx.lineTo(cx + 8 - swing*0.7, footY);
    ctx.stroke();

    // Body
    ctx.beginPath();
    ctx.moveTo(cx, neck);
    ctx.lineTo(cx, waist);
    ctx.stroke();

    // Arms
    const armSwing = [8,0,-8,0][step];
    ctx.beginPath();
    ctx.moveTo(cx, neck+4);
    ctx.lineTo(cx - 11*facing - armSwing*0.4, waist-4);
    ctx.moveTo(cx, neck+4);
    ctx.lineTo(cx + 11*facing + armSwing*0.4, waist-4);
    ctx.stroke();

    // Head
    ctx.fillStyle = dead ? '#ff8888' : (step===1 && !player.onGround ? '#fffde7' : '#fff');
    ctx.beginPath();
    ctx.arc(cx, headCY, headR, 0, Math.PI*2);
    ctx.fill();
    ctx.stroke();

    if (dead) {
      // X eyes
      ctx.lineWidth=1.8;
      ctx.beginPath();
      ctx.moveTo(cx-5,headCY-3); ctx.lineTo(cx-2,headCY);
      ctx.moveTo(cx-2,headCY-3); ctx.lineTo(cx-5,headCY);
      ctx.moveTo(cx+2,headCY-3); ctx.lineTo(cx+5,headCY);
      ctx.moveTo(cx+5,headCY-3); ctx.lineTo(cx+2,headCY);
      ctx.stroke();
    } else {
      // Eyes
      ctx.fillStyle='#111';
      ctx.beginPath();
      ctx.arc(cx+facing*3, headCY-1, 2, 0, Math.PI*2);
      ctx.fill();

      // Mouth
      ctx.lineWidth=1.5;
      ctx.beginPath();
      if (!player.onGround) {
        // open mouth while jumping
        ctx.arc(cx+facing*2, headCY+3, 3, 0, Math.PI);
        ctx.fill();
      } else {
        ctx.arc(cx+facing*2, headCY+2, 2.5, 0.1, Math.PI-0.1);
        ctx.stroke();
      }
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = p.life/50;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawOverlay(msg, sub, col) {
    ctx.fillStyle='rgba(0,0,0,0.65)';
    ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle=col||'#fff';
    ctx.font='bold 52px Segoe UI, Arial';
    ctx.fillText(msg, W/2, H/2-20);
    if (sub) {
      ctx.fillStyle='rgba(255,255,255,0.75)';
      ctx.font='22px Segoe UI, Arial';
      ctx.fillText(sub, W/2, H/2+28);
    }
    ctx.textAlign='left';
  }

  function drawLevelBanner() {
    // level label in corner
    ctx.fillStyle='rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.roundRect(8,8,110,28,6);
    ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.9)';
    ctx.font='bold 14px Segoe UI, Arial';
    ctx.fillText(`Level ${currentLevel} / ${LEVELS.length}`, 16, 27);

    // Timer warning colour
    const pct = timer / levelData.time;
    ctx.fillStyle = pct < 0.3 ? '#FF5252' : pct < 0.6 ? '#FFD740' : 'rgba(255,255,255,0.9)';
    ctx.font='bold 14px Segoe UI, Arial';
    ctx.textAlign='right';
    ctx.fillText(`⏱ ${timer}s`, W-16, 27);
    ctx.textAlign='left';
  }

  // ─── Main draw ─────────────────────────────────────────────
  function draw() {
    if (!levelData) return;
    const lvl = levelData;

    drawSky(lvl);

    // Platforms (static + moving)
    for (const p of [...lvl.platforms, ...levelMovPlats]) drawPlatform(p);

    // Spikes
    for (const s of lvl.spikes) drawSpikes(s);

    // Goal
    drawGoal(lvl.goal);

    // Enemies
    for (const e of levelEnemies) drawEnemy(e);

    // Player (blink when dead)
    const blink = player.dead && Math.floor(Date.now()/150)%2===0;
    if (!blink) {
      drawStickFigure(player.x, player.y, player.step, player.facing, player.dead);
    }

    drawParticles();
    drawLevelBanner();

    // Overlay messages
    if (state==='nextLevel')  drawOverlay('Level geschafft! 🎉','Nächstes Level lädt...','#FFD700');
    if (state==='dead')       drawOverlay('Gestorben!','Nochmal versuchen...','#FF5252');
    if (state==='gameOver')   drawOverlay('GAME OVER','Drücke R zum Neustart','#FF5252');
    if (state==='win')        drawOverlay('Du hast gewonnen!','Alle Level abgeschlossen! Drücke R','#FFD700');
  }

  // ─── Loop ──────────────────────────────────────────────────
  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  initLevel(1);
  loop();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strichmännchen Abenteuer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #fff;
      user-select: none;
    }
    #hud {
      display: flex;
      gap: 30px;
      margin-bottom: 10px;
      font-size: 16px;
      background: rgba(255,255,255,0.08);
      padding: 8px 28px;
      border-radius: 20px;
    }
    #hud .label { opacity: 0.65; font-size: 13px; margin-right: 4px; }
    #hud .val   { font-weight: bold; font-size: 18px; }
    canvas {
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      display: block;
      box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }
    #controls {
      margin-top: 10px;
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      display: flex;
      gap: 20px;
    }
    #controls kbd {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="hud">
    <span><span class="label">Level</span><span class="val" id="lvlDisplay">1 / 100</span></span>
    <span><span class="label">Versuche</span><span class="val" id="tryDisplay">0</span></span>
  </div>
  <canvas id="c" width="960" height="520"></canvas>
  <div id="controls">
    <span><kbd>←</kbd><kbd>→</kbd> Bewegen</span>
    <span><kbd>↑</kbd> / <kbd>Leertaste</kbd> Springen (2×)</span>
    <span><kbd>R</kbd> Level neu</span>
  </div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = 960, H = 520;      // canvas size
const LW = 1900;             // level world width (wider than canvas → scrolling)
const GY = 472;              // ground top y

// ── Physics ──────────────────────────────────────────────
const MAX_SPEED  = 2.66;
const ACCEL_GND  = 0.44;
const ACCEL_AIR  = 0.22;
const DECEL_GND  = 0.78;
const DECEL_AIR  = 0.95;
const GRAVITY    = 0.55;
const MAX_FALL   = 16;
const JUMP_VY    = -12.5;
const JUMP2_VY   = -11.2;   // double jump slightly weaker
const JUMP_CUT   = 0.45;
const COYOTE_MAX = 8;
const JBUF_MAX   = 10;

// ── Input ────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyR') { tries = 0; initLevel(currentLevel); }
});
document.addEventListener('keyup', e => {
  keys[e.code] = false;
  if ((e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space') && player.vy < 0)
    player.vy *= JUMP_CUT;
});

// ── State ────────────────────────────────────────────────
let state        = 'playing';
let currentLevel = 1;
let tries        = 0;
let particles    = [];
let deathTimer   = 0;
let cameraX      = 0;        // horizontal scroll offset
const TOTAL_LEVELS = 100;

// ── Player ───────────────────────────────────────────────
const PW = 22, PH = 42;
const player = {
  x:0, y:0, vx:0, vy:0,
  onGround:false, wasOnGround:false,
  facing:1, dead:false,
  jumpCount:0,         // 0=no jumps used, 1=first, 2=double (max)
  walkCycle:0,
  landSquish:0,
  jumpStretch:0,
  lean:0,
  coyote:0,
  jumpBuf:0,
  jumpWasDown:false,   // prevents held key from auto-firing double jump
};

// ── RNG ──────────────────────────────────────────────────
function mkRng(seed) {
  let s = (seed * 747796405 + 2891336453) >>> 0;
  return () => { s^=s<<13; s^=s>>17; s^=s<<5; return (s>>>0)/4294967296; };
}

// ── Level generator ──────────────────────────────────────
const LEVEL_CACHE = {};

function generateLevel(n) {
  if (LEVEL_CACHE[n]) return LEVEL_CACHE[n];
  const rng = mkRng(n);
  const t = (n-1)/(TOTAL_LEVELS-1);
  const d = t*t*(3-2*t); // smoothstep

  const skies = [
    ['#87CEEB','#c5eaff'],['#98D4E8','#a8d8ea'],['#FFB347','#ffd68a'],['#F4A261','#e76f51'],
    ['#EF9A9A','#c62828'],['#CE93D8','#6a1b9a'],['#80CBC4','#00695c'],['#A5D6A7','#2e7d32'],
    ['#FFCC80','#e65100'],['#FFF176','#f9a825'],['#F48FB1','#ad1457'],['#80DEEA','#00838f'],
    ['#B39DDB','#4527a0'],['#90CAF9','#1565c0'],['#BCAAA4','#4e342e'],['#EF9A9A','#b71c1c'],
    ['#9FA8DA','#283593'],['#80CBC4','#004d40'],['#616161','#212121'],['#455A64','#0a0a0a'],
  ];
  const sky = skies[Math.min(Math.floor((n-1)/5), skies.length-1)];

  const platforms   = [];
  const spikes      = [];
  const enemies     = [];
  const movingPlats = [];

  // Ground pads at start and end
  const startGW = 150, endGX = LW - 130;
  platforms.push({x:0,      y:GY, w:startGW,      h:48, c:'#5d4037'});
  platforms.push({x:endGX,  y:GY, w:LW - endGX,   h:48, c:'#5d4037'});

  // Platform chain across the full level width
  const chainCount = 5 + Math.floor(d * 18);          // 5 → 23
  const minGap     = 26 + d * 24;                     // 26 → 50
  const maxGap     = 50 + d * 65;                     // 50 → 115
  const minPW      = Math.max(40, 118 - d * 75);      // 118 → 43
  const maxDY      = 36 + d * 78;                     // 36 → 114

  let cx = startGW, cy = GY - 30;
  for (let i = 0; i < chainCount; i++) {
    const gap = minGap + rng()*(maxGap-minGap);
    const pw  = minPW  + rng()*40;
    const dy  = (rng()-0.48)*maxDY*2;
    const ny  = Math.max(230, Math.min(GY-30, cy+dy));
    const nx  = cx + gap;
    if (nx + pw > endGX - 18) break;
    platforms.push({x:nx, y:ny, w:pw, h:14, c:'#4e342e'});
    cx = nx+pw; cy = ny;
  }

  // Guaranteed approach chain: fill remaining gap to end-ground with safe platforms.
  // Each step is at most 68px gap + 85px platform → always jumpable.
  // Gradually descends toward ground level so the player can walk onto the end.
  {
    const STEP_GAP = 68;
    const STEP_W   = 85;
    let ax = cx, ay = cy;
    while (ax + STEP_GAP + STEP_W < endGX - 6) {
      ax += STEP_GAP;
      ay  = Math.min(ay + 28, GY - 22); // step down gently
      platforms.push({x: ax, y: ay, w: STEP_W, h: 14, c: '#5d4037'});
      ax += STEP_W;
    }
  }

  // ── Spikes: on TOP of mid-platforms (not on the ground) ─
  if (n >= 8) {
    const dSpike = (n-8)/(TOTAL_LEVELS-8);
    const midPlats = platforms.filter(p => p.h===14 && p.w >= 52);
    const groupCount = 1 + Math.floor(dSpike * 8);
    const usedPlats  = new Set();
    for (let i = 0; i < groupCount; i++) {
      if (!midPlats.length) break;
      const pi = Math.floor(rng()*midPlats.length);
      if (usedPlats.has(pi)) continue;
      usedPlats.add(pi);
      const p  = midPlats[pi];
      const sn = 1 + Math.floor(rng()*Math.min(dSpike*4+1, 4));
      // leave at least 10px on each side so player has landing room
      const maxOff = p.w - sn*SW - 20;
      if (maxOff < 0) continue;
      const sx = p.x + 10 + Math.floor(rng()*maxOff);
      spikes.push({x:sx, y:p.y, n:sn}); // y = platform top surface
    }
  }

  // ── Enemies ──────────────────────────────────────────────
  if (n >= 15) {
    const dEnemy = (n-15)/(TOTAL_LEVELS-15);
    const midPlats = platforms.filter(p => p.h===14 && p.w >= 58);
    const eCount   = Math.min(1+Math.floor(dEnemy*6), 7);
    const placed   = new Set();
    for (let i=0; i<eCount; i++) {
      if (!midPlats.length) break;
      const pi = Math.floor(rng()*midPlats.length);
      if (placed.has(pi)) continue;
      placed.add(pi);
      const p   = midPlats[pi];
      // Slower enemies: max speed ~1.8 instead of 3.9
      const spd = 0.5 + dEnemy * 1.5;
      enemies.push({
        x:p.x+5, y:p.y-30, w:26, h:30,
        vx:(rng()>0.5?1:-1)*spd,
        minX:p.x, maxX:p.x+p.w-26, alive:true,
      });
    }
  }

  // ── Moving platforms ─────────────────────────────────────
  if (n >= 20) {
    const dMov  = (n-20)/(TOTAL_LEVELS-20);
    const mCount = Math.min(1+Math.floor(dMov*6), 6);
    for (let i=0; i<mCount; i++) {
      const mx  = 200 + Math.floor(rng()*(LW-400));
      const my  = 240 + Math.floor(rng()*190);
      const spd = 1.0 + dMov * 2.4;
      const vert = n>=40 && rng()>0.55;
      movingPlats.push({
        x:mx, y:my, w:74, h:14,
        vx: vert?0 : spd*(rng()>0.5?1:-1),
        vy: vert ? spd*(rng()>0.5?1:-1) : 0,
        minX:mx-90, maxX:mx+90,
        minY:my-90, maxY:my+90,
        c:'#bf360c',
      });
    }
  }

  const lvl = {
    sky, platforms, spikes, enemies,
    movingPlatforms: movingPlats,
    // goal trigger = whole end-ground zone; flagX is where the visual flag is drawn
    goal:  {x:endGX, y:-200, w:LW-endGX, h:H+400, flagX:endGX+55},
    start: {x:30, y:GY-PH-2},
  };
  LEVEL_CACHE[n] = lvl;
  return lvl;
}

// ── Working copies ────────────────────────────────────────
let levelData    = null;
let levelEnemies = [];
let levelMovPlat = [];

// ── Helpers ──────────────────────────────────────────────
function overlap(ax,ay,aw,ah,bx,by,bw,bh) {
  return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by;
}
function spawnParticles(x,y,col,n) {
  for (let i=0;i<n;i++) {
    const a=Math.random()*Math.PI*2, s=1+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:28+Math.random()*22,col});
  }
}

// ── Init level ───────────────────────────────────────────
function initLevel(n) {
  const lvl    = generateLevel(n);
  levelData    = lvl;
  levelEnemies = lvl.enemies.map(e=>({...e}));
  levelMovPlat = lvl.movingPlatforms.map(p=>({...p}));
  particles    = [];
  deathTimer   = 0;
  cameraX      = 0;

  player.x          = lvl.start.x;
  player.y          = lvl.start.y;
  player.vx         = player.vy = 0;
  player.onGround   = player.wasOnGround = false;
  player.dead       = false;
  player.facing     = 1;
  player.jumpCount   = 0;
  player.walkCycle   = 0;
  player.landSquish  = 0;
  player.jumpStretch = 0;
  player.lean        = 0;
  player.coyote      = 0;
  player.jumpBuf     = 0;
  player.jumpWasDown = false;

  state = 'playing';
  updateHUD();
}

function updateHUD() {
  document.getElementById('lvlDisplay').textContent = `${currentLevel} / ${TOTAL_LEVELS}`;
  document.getElementById('tryDisplay').textContent  = tries;
}

function die() {
  if (player.dead) return;
  player.dead = true;
  tries++;
  updateHUD();
  spawnParticles(player.x+PW/2, player.y+PH/2, '#ff4444', 16);
  state = 'dead';
  deathTimer = 85;
}

function completeLevel() {
  spawnParticles(levelData.goal.x+13, levelData.goal.y+60, '#FFD700', 32);
  state = 'nextLevel';
  setTimeout(() => {
    if (currentLevel >= TOTAL_LEVELS) { state='win'; return; }
    currentLevel++;
    tries = 0;
    initLevel(currentLevel);
  }, 1800);
}

// ── Spike hitboxes ────────────────────────────────────────
const SW = 18, SH = 20;
function spikeBoxes(s) {
  return Array.from({length:s.n},(_,i)=>({x:s.x+i*SW, y:s.y-SH, w:SW, h:SH}));
}

// ── Update ───────────────────────────────────────────────
function update() {
  if (state==='dead') { if (--deathTimer<=0) initLevel(currentLevel); return; }
  if (state!=='playing') return;

  const lvl = levelData;

  // Horizontal
  const left  = keys['ArrowLeft']  || keys['KeyA'];
  const right = keys['ArrowRight'] || keys['KeyD'];
  const accel = player.onGround ? ACCEL_GND : ACCEL_AIR;
  const decel = player.onGround ? DECEL_GND : DECEL_AIR;
  if      (left && !right)  { player.vx=Math.max(player.vx-accel,-MAX_SPEED); player.facing=-1; }
  else if (right && !left)  { player.vx=Math.min(player.vx+accel, MAX_SPEED); player.facing= 1; }
  else                      { player.vx*=decel; if(Math.abs(player.vx)<0.05) player.vx=0; }

  // Coyote time
  if (player.wasOnGround && !player.onGround && player.vy>=0) player.coyote=COYOTE_MAX;
  if (player.coyote>0) player.coyote--;

  // Jump buffer — only on a FRESH key press, not while held
  const jumpDown    = keys['ArrowUp']||keys['KeyW']||keys['Space'];
  const jumpPressed = jumpDown && !player.jumpWasDown;
  player.jumpWasDown = jumpDown;
  if (jumpPressed) player.jumpBuf = JBUF_MAX;
  if (player.jumpBuf > 0) player.jumpBuf--;

  // Jump logic
  const canFirst = player.onGround || player.coyote>0;
  if (player.jumpBuf>0) {
    if (canFirst) {
      player.vy=JUMP_VY; player.jumpCount=1;
      player.coyote=0; player.jumpBuf=0;
      player.jumpStretch=1;
    } else if (player.jumpCount<2) {
      // Double jump
      player.vy=JUMP2_VY; player.jumpCount=2;
      player.jumpBuf=0;
      player.jumpStretch=0.8;
      spawnParticles(player.x+PW/2, player.y+PH, '#88ccff', 9);
    }
  }

  // Gravity
  player.vy=Math.min(player.vy+GRAVITY, MAX_FALL);
  player.x+=player.vx; player.y+=player.vy;

  // Animation
  if (player.onGround) player.walkCycle+=Math.abs(player.vx)*0.55;
  player.landSquish *=0.75; player.jumpStretch*=0.80;
  const targetLean=player.onGround?0:player.vx*0.018;
  player.lean+=(targetLean-player.lean)*0.12;

  // Moving platforms
  for (const p of levelMovPlat) {
    const px0=p.x, py0=p.y;
    if (p.vx){p.x+=p.vx; if(p.x<=p.minX||p.x+p.w>=p.maxX)p.vx=-p.vx;}
    if (p.vy){p.y+=p.vy; if(p.y<=p.minY||p.y+p.h>=p.maxY)p.vy=-p.vy;}
    if (player.onGround && player.x+PW>px0 && player.x<px0+p.w && Math.abs((player.y+PH)-py0)<5) {
      player.x+=p.x-px0; player.y+=p.y-py0;
    }
  }

  // Platform collision
  player.wasOnGround=player.onGround; player.onGround=false;
  for (const p of [...lvl.platforms,...levelMovPlat]) {
    if (!overlap(player.x,player.y,PW,PH,p.x,p.y,p.w,p.h)) continue;
    const ol=(player.x+PW)-p.x, or_=(p.x+p.w)-player.x;
    const ot=(player.y+PH)-p.y, ob=(p.y+p.h)-player.y;
    const mn=Math.min(ol,or_,ot,ob);
    if      (mn===ot&&player.vy>=0){player.y=p.y-PH;player.vy=0;player.onGround=true;}
    else if (mn===ob&&player.vy<0) {player.y=p.y+p.h;player.vy=0;}
    else if (mn===ol)              {player.x=p.x-PW; player.vx=0;}
    else                           {player.x=p.x+p.w;player.vx=0;}
  }

  // Landing
  if (!player.wasOnGround && player.onGround) {
    player.landSquish=Math.min(0.9,Math.abs(player.vy)*0.055);
    player.jumpCount=0; // reset double jump on land
  }

  if (player.x<0){player.x=0;player.vx=0;}
  if (player.x+PW>LW){player.x=LW-PW;player.vx=0;}

  // Spikes
  for (const s of lvl.spikes)
    for (const b of spikeBoxes(s))
      if (overlap(player.x+3,player.y+8,PW-6,PH-8,b.x,b.y,b.w,b.h)){die();return;}

  // Enemies
  for (const e of levelEnemies) {
    if (!e.alive) continue;
    e.x+=e.vx; if(e.x<=e.minX||e.x+e.w>=e.maxX)e.vx=-e.vx;
    if (overlap(player.x+2,player.y+2,PW-4,PH-4,e.x,e.y,e.w,e.h)) {
      if (player.vy>0 && player.y+PH<e.y+e.h*0.55+4) {
        e.alive=false; player.vy=JUMP2_VY*0.85;
        spawnParticles(e.x+e.w/2,e.y+e.h/2,'#FF5722',12);
      } else {die();return;}
    }
  }

  // Goal
  const g=lvl.goal;
  if (overlap(player.x,player.y,PW,PH,g.x,g.y,g.w,g.h)) completeLevel();

  if (player.y>H+80) die();

  // Camera smooth follow (player at 38% from left)
  const targetCam = player.x - W*0.38;
  cameraX += (targetCam - cameraX) * 0.09;
  cameraX = Math.max(0, Math.min(cameraX, LW-W));

  // Particles
  for (const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=0.18;p.life--;}
  particles=particles.filter(p=>p.life>0);
}

// ── Drawing ──────────────────────────────────────────────
const SW_ = SW; // alias for spike width inside draw functions

function drawSky(lvl) {
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,lvl.sky[0]); g.addColorStop(1,lvl.sky[1]);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // Parallax clouds (static pattern, cheap)
  ctx.fillStyle='rgba(255,255,255,0.18)';
  const offX = cameraX*0.25;
  const cloudSeeds = [80,240,440,650,860,1060,1280,1480,1680];
  for (const cx_ of cloudSeeds) {
    const bx = ((cx_ - offX%400 + 400)%1600) - 200;
    ctx.beginPath(); ctx.ellipse(bx, 80, 60,28, 0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(bx+55,72,44,22,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(bx-40,82,40,20,0,0,Math.PI*2); ctx.fill();
  }
}

function drawPlatform(p) {
  ctx.fillStyle=p.c||'#5d4037'; ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle='rgba(255,255,255,0.2)'; ctx.fillRect(p.x,p.y,p.w,3);
  ctx.fillStyle='rgba(0,0,0,0.25)';     ctx.fillRect(p.x,p.y+p.h-4,p.w,4);
}

function drawSpikes(s) {
  // Drawn pointing UP from s.y (platform surface)
  ctx.fillStyle='#FF3333';
  for (let i=0;i<s.n;i++) {
    const bx=s.x+i*SW;
    ctx.beginPath(); ctx.moveTo(bx,s.y); ctx.lineTo(bx+SW/2,s.y-SH); ctx.lineTo(bx+SW,s.y); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle='rgba(255,200,200,0.55)';
  for (let i=0;i<s.n;i++) {
    const bx=s.x+i*SW;
    ctx.beginPath(); ctx.moveTo(bx+SW*0.35,s.y-SH*0.2); ctx.lineTo(bx+SW/2,s.y-SH+3); ctx.lineTo(bx+SW*0.55,s.y-SH*0.2); ctx.closePath(); ctx.fill();
  }
}

function drawEnemy(e) {
  if (!e.alive) return;
  const cx=e.x+e.w/2, top=e.y;
  ctx.strokeStyle='#c0392b'; ctx.lineWidth=2.5; ctx.lineCap='round';
  ctx.fillStyle='#e74c3c';
  ctx.beginPath(); ctx.arc(cx,top+7,7,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.strokeStyle='#7b0000'; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(cx-6,top+3); ctx.lineTo(cx-2,top+6);
  ctx.moveTo(cx+6,top+3); ctx.lineTo(cx+2,top+6);
  ctx.stroke();
  ctx.fillStyle='#500';
  ctx.beginPath(); ctx.arc(cx-3,top+7,2,0,Math.PI*2); ctx.arc(cx+3,top+7,2,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#c0392b'; ctx.lineWidth=2.5;
  ctx.beginPath();
  ctx.moveTo(cx,top+14); ctx.lineTo(cx,top+22);
  ctx.moveTo(cx-9,top+17); ctx.lineTo(cx+9,top+17);
  ctx.moveTo(cx,top+22); ctx.lineTo(cx-6,top+30);
  ctx.moveTo(cx,top+22); ctx.lineTo(cx+6,top+30);
  ctx.stroke();
}

function drawGoal(g) {
  const px  = g.flagX;
  const poleTop = GY - 160;
  const t   = Date.now() / 350;
  const pulse = 0.5 + 0.5 * Math.sin(t * 2);

  // Large pulsing glow beacon
  const grd = ctx.createRadialGradient(px, GY - 80, 0, px, GY - 80, 110 + pulse * 30);
  grd.addColorStop(0, `rgba(80,255,120,${0.28 + pulse * 0.14})`);
  grd.addColorStop(1, 'rgba(80,255,120,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(px - 150, 0, 300, H);

  // Vertical light beam
  const beam = ctx.createLinearGradient(0, 0, 0, GY);
  beam.addColorStop(0, `rgba(80,255,120,${0.05 + pulse*0.08})`);
  beam.addColorStop(1, 'rgba(80,255,120,0)');
  ctx.fillStyle = beam;
  ctx.fillRect(px - 18, 0, 36, GY);

  // Pole
  ctx.strokeStyle = '#ddd'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(px, GY + 2); ctx.lineTo(px, poleTop); ctx.stroke();

  // Waving flag
  ctx.fillStyle = '#00e676';
  ctx.beginPath();
  ctx.moveTo(px, poleTop);
  ctx.bezierCurveTo(
    px+22, poleTop + 8  + Math.sin(t)*4,
    px+22, poleTop + 18 + Math.sin(t+0.6)*4,
    px,    poleTop + 28
  );
  ctx.fill();
  // Star on flag
  ctx.fillStyle = '#fff'; ctx.font = 'bold 14px Arial';
  ctx.textAlign = 'center'; ctx.fillText('★', px + 10, poleTop + 20); ctx.textAlign = 'left';

  // "ZIEL" label with glow
  ctx.shadowColor = '#00ff88'; ctx.shadowBlur = 12;
  ctx.fillStyle = '#00ff88'; ctx.font = 'bold 18px Segoe UI,Arial';
  ctx.textAlign = 'center'; ctx.fillText('ZIEL', px, GY + 22); ctx.textAlign = 'left';
  ctx.shadowBlur = 0;

  // Ground color hint (green tint on end-ground)
  ctx.fillStyle = `rgba(0,230,100,${0.10 + pulse*0.06})`;
  ctx.fillRect(g.x, GY, LW - g.x, 48);
}

function drawStickFigure(px,py,p) {
  const cx=px+PW/2;
  const sy=1+p.jumpStretch*0.28-p.landSquish*0.30;
  const sx=1-p.jumpStretch*0.16+p.landSquish*0.22;

  ctx.save();
  ctx.translate(cx, py+PH);
  ctx.rotate(p.lean);
  ctx.scale(sx,sy);
  ctx.translate(-cx,-(py+PH));

  const headR=9, headCY=py+headR, neck=py+headR*2, waist=py+headR*2+14, footY=py+PH;
  const swing=p.dead?0:Math.sin(p.walkCycle)*14;

  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.lineWidth=p.dead?2:2.5;
  ctx.strokeStyle=p.dead?'#ff4444':'#111';

  // Legs
  ctx.beginPath();
  ctx.moveTo(cx,waist); ctx.lineTo(cx-8+swing,footY);
  ctx.moveTo(cx,waist); ctx.lineTo(cx+8-swing,footY);
  ctx.stroke();
  // Body
  ctx.beginPath(); ctx.moveTo(cx,neck); ctx.lineTo(cx,waist); ctx.stroke();
  // Arms
  const aw=Math.sin(p.walkCycle+Math.PI)*10;
  ctx.beginPath();
  ctx.moveTo(cx,neck+4); ctx.lineTo(cx-11*p.facing+aw*0.4, waist-4);
  ctx.moveTo(cx,neck+4); ctx.lineTo(cx+11*p.facing-aw*0.4, waist-4);
  ctx.stroke();
  // Head
  ctx.fillStyle=p.dead?'#ff8888':'#fff';
  ctx.beginPath(); ctx.arc(cx,headCY,headR,0,Math.PI*2); ctx.fill(); ctx.stroke();

  if (p.dead) {
    ctx.lineWidth=1.8;
    ctx.beginPath();
    ctx.moveTo(cx-5,headCY-3); ctx.lineTo(cx-2,headCY); ctx.moveTo(cx-2,headCY-3); ctx.lineTo(cx-5,headCY);
    ctx.moveTo(cx+2,headCY-3); ctx.lineTo(cx+5,headCY); ctx.moveTo(cx+5,headCY-3); ctx.lineTo(cx+2,headCY);
    ctx.stroke();
  } else {
    ctx.fillStyle='#111';
    ctx.beginPath(); ctx.arc(cx+p.facing*3,headCY-1,2,0,Math.PI*2); ctx.fill();
    ctx.lineWidth=1.5;
    if (!p.onGround && p.vy<-2) {
      ctx.fillStyle='#333';
      ctx.beginPath(); ctx.arc(cx+p.facing*2,headCY+3,2.5,0,Math.PI); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(cx+p.facing*2,headCY+2,2.5,0.1,Math.PI-0.1); ctx.stroke();
    }
    // Double-jump indicator: small star above head when jumpCount==1 and in air
    if (!p.onGround && p.jumpCount===1) {
      ctx.fillStyle='rgba(136,204,255,0.85)';
      ctx.font='10px Arial'; ctx.textAlign='center';
      ctx.fillText('✦', cx, headCY-headR-4);
      ctx.textAlign='left';
    }
  }

  ctx.restore();
  if (!p.dead) {
    ctx.fillStyle='rgba(0,0,0,0.13)';
    ctx.beginPath(); ctx.ellipse(cx,py+PH+2,9*sx,3,0,0,Math.PI*2); ctx.fill();
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha=p.life/50; ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawOverlay(msg,sub,col) {
  ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle=col||'#fff'; ctx.font='bold 52px Segoe UI,Arial'; ctx.fillText(msg,W/2,H/2-18);
  if (sub){ctx.fillStyle='rgba(255,255,255,0.75)'; ctx.font='22px Segoe UI,Arial'; ctx.fillText(sub,W/2,H/2+30);}
  ctx.textAlign='left';
}

// Progress bar showing how far through the level the player is
function drawProgressBar() {
  const pct = Math.max(0, Math.min(1, player.x / LW));
  const bw=200, bh=6, bx=W-bw-16, by=16;
  ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,3); ctx.fill();
  ctx.fillStyle='#FFD700'; ctx.beginPath(); ctx.roundRect(bx,by,bw*pct,bh,3); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.font='10px Segoe UI,Arial';
  ctx.textAlign='right'; ctx.fillText(`${Math.round(pct*100)}%`, W-16, by+bh+12); ctx.textAlign='left';
}

function draw() {
  if (!levelData) return;
  const lvl=levelData;

  // Sky (full canvas, no camera offset)
  drawSky(lvl);

  // World space (camera offset)
  ctx.save();
  ctx.translate(-Math.round(cameraX), 0);

  for (const p of [...lvl.platforms,...levelMovPlat]) drawPlatform(p);
  for (const s of lvl.spikes) drawSpikes(s);
  drawGoal(lvl.goal);
  for (const e of levelEnemies) drawEnemy(e);

  const blink=player.dead && Math.floor(Date.now()/130)%2===0;
  if (!blink) drawStickFigure(player.x,player.y,player);
  drawParticles();

  ctx.restore();

  // HUD overlay (screen space)
  ctx.fillStyle='rgba(0,0,0,0.38)';
  ctx.beginPath(); ctx.roundRect(8,8,148,28,6); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.92)'; ctx.font='bold 14px Segoe UI,Arial';
  ctx.fillText(`Level ${currentLevel} / ${TOTAL_LEVELS}`,16,27);
  drawProgressBar();

  if (state==='dead')      drawOverlay('Nochmal!','Respawn in Kürze...','#FF7043');
  if (state==='nextLevel') drawOverlay('Level geschafft! 🎉','Nächstes Level lädt...','#FFD700');
  if (state==='win')       drawOverlay('Glückwunsch!','Alle 100 Level gemeistert!  Drücke R','#FFD700');
}

// ── Loop ─────────────────────────────────────────────────
function loop() { update(); draw(); requestAnimationFrame(loop); }
initLevel(1);
loop();
</script>
</body>

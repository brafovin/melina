<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strichmännchen Abenteuer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #fff;
      user-select: none;
    }
    #hud {
      display: flex;
      gap: 30px;
      margin-bottom: 10px;
      font-size: 16px;
      background: rgba(255,255,255,0.08);
      padding: 8px 28px;
      border-radius: 20px;
    }
    #hud .label { opacity: 0.65; font-size: 13px; margin-right: 4px; }
    #hud .val   { font-weight: bold; font-size: 18px; }
    canvas {
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      display: block;
      box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }
    #controls {
      margin-top: 10px;
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      display: flex;
      gap: 20px;
    }
    #controls kbd {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="hud">
    <span><span class="label">Level</span><span class="val" id="lvlDisplay">1 / 100</span></span>
    <span><span class="label">Versuche</span><span class="val" id="tryDisplay">0</span></span>
  </div>
  <canvas id="c" width="800" height="480"></canvas>
  <div id="controls">
    <span><kbd>←</kbd><kbd>→</kbd> Bewegen</span>
    <span><kbd>↑</kbd> / <kbd>Leertaste</kbd> Springen</span>
    <span><kbd>R</kbd> Level neu</span>
  </div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = 800, H = 480;

// ── Physics constants ─────────────────────────────────────
const MAX_SPEED   = 2.66;   // 5% slower than before (2.8)
const ACCEL_GND   = 0.44;   // acceleration on ground
const ACCEL_AIR   = 0.22;   // less control in air
const DECEL_GND   = 0.78;   // friction on ground
const DECEL_AIR   = 0.95;   // almost no air friction
const GRAVITY     = 0.55;
const MAX_FALL    = 16;
const JUMP_VY     = -12.5;
const JUMP_CUT    = 0.45;   // multiplier when jump released early
const COYOTE_MAX  = 8;      // frames after leaving edge where jump still works
const JBUF_MAX    = 10;     // frames jump is buffered before landing

// ── Input ────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyR') { tries = 0; initLevel(currentLevel); }
});
document.addEventListener('keyup', e => {
  keys[e.code] = false;
  // Variable jump height: cut upward velocity if jump released early
  if ((e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') && player.vy < 0) {
    player.vy *= JUMP_CUT;
  }
});

// ── State ─────────────────────────────────────────────────
let state        = 'playing';
let currentLevel = 1;
let tries        = 0;
let particles    = [];
let deathTimer   = 0;
const TOTAL_LEVELS = 100;

// ── Player ────────────────────────────────────────────────
const PW = 22, PH = 42;
const player = {
  x:0, y:0, vx:0, vy:0,
  onGround:false, wasOnGround:false,
  facing:1, dead:false,
  // animation
  walkCycle:0,          // continuous counter for sin-based legs
  landSquish:0,         // 0-1 squash on landing, fades out
  jumpStretch:0,        // 0-1 stretch on jump takeoff, fades out
  lean:0,               // tilt when airborne (radians)
  // gameplay helpers
  coyote:0,             // coyote time remaining
  jumpBuf:0,            // buffered jump remaining
};

// ── Deterministic RNG ────────────────────────────────────
function mkRng(seed) {
  let s = (seed * 747796405 + 2891336453) >>> 0;
  return () => {
    s ^= s << 13; s ^= s >> 17; s ^= s << 5;
    return (s >>> 0) / 4294967296;
  };
}

// ── Level generator ──────────────────────────────────────
const LEVEL_CACHE = {};

function generateLevel(n) {
  if (LEVEL_CACHE[n]) return LEVEL_CACHE[n];
  const rng = mkRng(n);

  // Smooth difficulty 0→1 over 100 levels, quadratic ease-in
  // so early levels stay easy for longer
  const t = (n - 1) / (TOTAL_LEVELS - 1);
  const d = t * t * (3 - 2 * t); // smoothstep: slow-fast-slow

  // Sky palette — 20 colours, changes every 5 levels
  const skies = [
    ['#87CEEB','#c5eaff'], // 1-5
    ['#98D4E8','#a8d8ea'], // 6-10
    ['#FFB347','#ffd68a'], // 11-15
    ['#F4A261','#e76f51'], // 16-20
    ['#EF9A9A','#c62828'], // 21-25
    ['#CE93D8','#6a1b9a'], // 26-30
    ['#80CBC4','#00695c'], // 31-35
    ['#A5D6A7','#2e7d32'], // 36-40
    ['#FFCC80','#e65100'], // 41-45
    ['#FFF176','#f9a825'], // 46-50
    ['#F48FB1','#ad1457'], // 51-55
    ['#80DEEA','#00838f'], // 56-60
    ['#B39DDB','#4527a0'], // 61-65
    ['#90CAF9','#1565c0'], // 66-70
    ['#BCAAA4','#4e342e'], // 71-75
    ['#EF9A9A','#b71c1c'], // 76-80
    ['#9FA8DA','#283593'], // 81-85
    ['#80CBC4','#004d40'], // 86-90
    ['#616161','#212121'], // 91-95
    ['#455A64','#0a0a0a'], // 96-100
  ];
  const sky = skies[Math.min(Math.floor((n-1)/5), skies.length-1)];

  const platforms   = [];
  const spikes      = [];
  const enemies     = [];
  const movingPlats = [];

  // Fixed start/end ground
  const startGW = 130, endGX = 700;
  platforms.push({x:0,      y:440, w:startGW,    h:40, c:'#5d4037'});
  platforms.push({x:endGX,  y:440, w:W - endGX,  h:40, c:'#5d4037'});

  // Platform chain — width/gap/height scale with difficulty
  const chainCount = 3 + Math.floor(d * 13);           // 3 → 16
  const minGap     = 25 + d * 22;                      // 25 → 47
  const maxGap     = 48 + d * 60;                      // 48 → 108  (safe jump ≈ 125px)
  const minPW      = Math.max(40, 115 - d * 72);       // 115 → 43
  const maxDY      = 35 + d * 75;                      // 35 → 110  (max jump h ≈ 142px)

  let cx = startGW, cy = 420;
  for (let i = 0; i < chainCount; i++) {
    const gap = minGap + rng() * (maxGap - minGap);
    const pw  = minPW  + rng() * 38;
    const dy  = (rng() - 0.48) * maxDY * 2;
    const ny  = Math.max(200, Math.min(425, cy + dy));
    const nx  = cx + gap;
    if (nx + pw > endGX - 15) break;
    platforms.push({x: nx, y: ny, w: pw, h: 14, c: '#4e342e'});
    cx = nx + pw; cy = ny;
  }

  // Spikes — introduced at level 8, scale slowly
  if (n >= 8) {
    const dSpike = (n - 8) / (TOTAL_LEVELS - 8);
    const groupCount = 1 + Math.floor(dSpike * 7);
    for (let i = 0; i < groupCount; i++) {
      const sx = 100 + Math.floor(rng() * 570);
      if (sx < 80 || sx > endGX - 10) continue;
      const sn = 1 + Math.floor(rng() * Math.min(dSpike * 5 + 1, 5));
      spikes.push({x: sx, y: 440, n: sn});
    }
  }

  // Enemies — introduced at level 15, scale slowly
  if (n >= 15) {
    const dEnemy = (n - 15) / (TOTAL_LEVELS - 15);
    const midPlats = platforms.filter(p => p.h === 14 && p.w >= 55);
    const eCount   = Math.min(1 + Math.floor(dEnemy * 6), 7);
    const placed   = new Set();
    for (let i = 0; i < eCount; i++) {
      if (!midPlats.length) break;
      const pi = Math.floor(rng() * midPlats.length);
      if (placed.has(pi)) continue;
      placed.add(pi);
      const p   = midPlats[pi];
      const spd = 0.9 + dEnemy * 3.0;
      enemies.push({
        x: p.x + 5, y: p.y - 30, w: 26, h: 30,
        vx: (rng() > 0.5 ? 1 : -1) * spd,
        minX: p.x, maxX: p.x + p.w - 26, alive: true,
      });
    }
  }

  // Moving platforms — introduced at level 20, scale slowly
  if (n >= 20) {
    const dMov  = (n - 20) / (TOTAL_LEVELS - 20);
    const mCount = Math.min(1 + Math.floor(dMov * 5), 5);
    for (let i = 0; i < mCount; i++) {
      const mx  = 160 + Math.floor(rng() * 490);
      const my  = 200 + Math.floor(rng() * 180);
      const spd = 1.1 + dMov * 2.5;
      const vert = n >= 40 && rng() > 0.55;
      movingPlats.push({
        x: mx, y: my, w: 72, h: 14,
        vx: vert ? 0 : spd * (rng() > 0.5 ? 1 : -1),
        vy: vert ? spd * (rng() > 0.5 ? 1 : -1) : 0,
        minX: mx - 85, maxX: mx + 85,
        minY: my - 85, maxY: my + 85,
        c: '#bf360c',
      });
    }
  }

  const lvl = {
    sky, platforms, spikes, enemies,
    movingPlatforms: movingPlats,
    goal:  {x: 752, y: 310, w: 24, h: 130},
    start: {x: 30,  y: 395},
  };
  LEVEL_CACHE[n] = lvl;
  return lvl;
}

// ── Working copies ────────────────────────────────────────
let levelData    = null;
let levelEnemies = [];
let levelMovPlat = [];

// ── Helpers ───────────────────────────────────────────────
function overlap(ax,ay,aw,ah,bx,by,bw,bh) {
  return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by;
}
function spawnParticles(x,y,col,n) {
  for (let i=0; i<n; i++) {
    const a = Math.random()*Math.PI*2, s = 1+Math.random()*4;
    particles.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:28+Math.random()*22, col});
  }
}

// ── Init level ────────────────────────────────────────────
function initLevel(n) {
  const lvl    = generateLevel(n);
  levelData    = lvl;
  levelEnemies = lvl.enemies.map(e => ({...e}));
  levelMovPlat = lvl.movingPlatforms.map(p => ({...p}));
  particles    = [];
  deathTimer   = 0;

  player.x          = lvl.start.x;
  player.y          = lvl.start.y;
  player.vx         = player.vy = 0;
  player.onGround   = player.wasOnGround = false;
  player.dead       = false;
  player.facing     = 1;
  player.walkCycle  = 0;
  player.landSquish = 0;
  player.jumpStretch = 0;
  player.lean       = 0;
  player.coyote     = 0;
  player.jumpBuf    = 0;

  state = 'playing';
  updateHUD();
}

function updateHUD() {
  document.getElementById('lvlDisplay').textContent = `${currentLevel} / ${TOTAL_LEVELS}`;
  document.getElementById('tryDisplay').textContent  = tries;
}

// ── Death / level complete ────────────────────────────────
function die() {
  if (player.dead) return;
  player.dead = true;
  tries++;
  updateHUD();
  spawnParticles(player.x+PW/2, player.y+PH/2, '#ff4444', 16);
  state = 'dead';
  deathTimer = 85;
}

function completeLevel() {
  spawnParticles(levelData.goal.x+12, levelData.goal.y+50, '#FFD700', 32);
  state = 'nextLevel';
  setTimeout(() => {
    if (currentLevel >= TOTAL_LEVELS) { state = 'win'; return; }
    currentLevel++;
    tries = 0;
    initLevel(currentLevel);
  }, 1800);
}

// ── Spike boxes ───────────────────────────────────────────
const SW = 18, SH = 20;
function spikeBoxes(s) {
  return Array.from({length: s.n}, (_, i) => ({x: s.x+i*SW, y: s.y-SH, w: SW, h: SH}));
}

// ── Update ────────────────────────────────────────────────
function update() {
  if (state === 'dead') {
    deathTimer--;
    if (deathTimer <= 0) initLevel(currentLevel);
    return;
  }
  if (state !== 'playing') return;

  const lvl = levelData;

  // ── Horizontal movement with acceleration ──────────────
  const left  = keys['ArrowLeft']  || keys['KeyA'];
  const right = keys['ArrowRight'] || keys['KeyD'];
  const accel = player.onGround ? ACCEL_GND : ACCEL_AIR;
  const decel = player.onGround ? DECEL_GND : DECEL_AIR;

  if (left && !right) {
    player.vx = Math.max(player.vx - accel, -MAX_SPEED);
    player.facing = -1;
  } else if (right && !left) {
    player.vx = Math.min(player.vx + accel,  MAX_SPEED);
    player.facing = 1;
  } else {
    player.vx *= decel;
    if (Math.abs(player.vx) < 0.05) player.vx = 0;
  }

  // ── Coyote time ────────────────────────────────────────
  if (player.wasOnGround && !player.onGround && player.vy >= 0) {
    player.coyote = COYOTE_MAX;
  }
  if (player.coyote > 0) player.coyote--;

  // ── Jump buffer ────────────────────────────────────────
  const jumpDown = keys['ArrowUp'] || keys['KeyW'] || keys['Space'];
  if (jumpDown) player.jumpBuf = JBUF_MAX;
  if (player.jumpBuf > 0) player.jumpBuf--;

  // ── Jump ───────────────────────────────────────────────
  const canJump = player.onGround || player.coyote > 0;
  if (player.jumpBuf > 0 && canJump) {
    player.vy         = JUMP_VY;
    player.coyote     = 0;
    player.jumpBuf    = 0;
    player.jumpStretch = 1;   // trigger stretch anim
  }

  // ── Gravity ────────────────────────────────────────────
  player.vy = Math.min(player.vy + GRAVITY, MAX_FALL);
  player.x += player.vx;
  player.y += player.vy;

  // ── Animation ──────────────────────────────────────────
  // Walk cycle driven by actual speed (realistic pacing)
  if (player.onGround) {
    player.walkCycle += Math.abs(player.vx) * 0.55;
  }
  // Squash/stretch decay
  player.landSquish  *= 0.75;
  player.jumpStretch *= 0.80;
  // Air lean (tilt forward in direction of motion when airborne)
  const targetLean = player.onGround ? 0 : player.vx * 0.018;
  player.lean += (targetLean - player.lean) * 0.12;

  // ── Moving platforms ───────────────────────────────────
  for (const p of levelMovPlat) {
    const px0 = p.x, py0 = p.y;
    if (p.vx) { p.x += p.vx; if (p.x<=p.minX||p.x+p.w>=p.maxX) p.vx=-p.vx; }
    if (p.vy) { p.y += p.vy; if (p.y<=p.minY||p.y+p.h>=p.maxY) p.vy=-p.vy; }
    if (player.onGround &&
        player.x+PW > px0 && player.x < px0+p.w &&
        Math.abs((player.y+PH) - py0) < 5) {
      player.x += p.x - px0;
      player.y += p.y - py0;
    }
  }

  // ── Platform collision ─────────────────────────────────
  player.wasOnGround = player.onGround;
  player.onGround    = false;
  const allPlats = [...lvl.platforms, ...levelMovPlat];
  for (const p of allPlats) {
    if (!overlap(player.x,player.y,PW,PH, p.x,p.y,p.w,p.h)) continue;
    const ol=(player.x+PW)-p.x, or_=(p.x+p.w)-player.x;
    const ot=(player.y+PH)-p.y, ob=(p.y+p.h)-player.y;
    const mn=Math.min(ol,or_,ot,ob);
    if      (mn===ot && player.vy>=0)  { player.y=p.y-PH;   player.vy=0; player.onGround=true; }
    else if (mn===ob && player.vy<0)   { player.y=p.y+p.h;  player.vy=0; }
    else if (mn===ol)                  { player.x=p.x-PW;   player.vx=0; }
    else                               { player.x=p.x+p.w;  player.vx=0; }
  }

  // Landing squash
  if (!player.wasOnGround && player.onGround) {
    player.landSquish = Math.min(0.9, Math.abs(player.vy) * 0.055);
  }

  if (player.x < 0)    { player.x=0;    player.vx=0; }
  if (player.x+PW > W) { player.x=W-PW; player.vx=0; }

  // ── Spikes ─────────────────────────────────────────────
  for (const s of lvl.spikes)
    for (const b of spikeBoxes(s))
      if (overlap(player.x+3,player.y+8,PW-6,PH-8, b.x,b.y,b.w,b.h)) { die(); return; }

  // ── Enemies ────────────────────────────────────────────
  for (const e of levelEnemies) {
    if (!e.alive) continue;
    e.x += e.vx;
    if (e.x<=e.minX||e.x+e.w>=e.maxX) e.vx=-e.vx;
    if (overlap(player.x+2,player.y+2,PW-4,PH-4, e.x,e.y,e.w,e.h)) {
      if (player.vy > 0 && player.y+PH < e.y+e.h*0.55+4) {
        e.alive=false; player.vy=JUMP_VY*0.52;
        spawnParticles(e.x+e.w/2, e.y+e.h/2, '#FF5722', 12);
      } else { die(); return; }
    }
  }

  // ── Goal ───────────────────────────────────────────────
  const g = lvl.goal;
  if (overlap(player.x,player.y,PW,PH, g.x,g.y,g.w,g.h)) completeLevel();

  // Fall out
  if (player.y > H+80) die();

  // Particles
  for (const p of particles) { p.x+=p.vx; p.y+=p.vy; p.vy+=0.18; p.life--; }
  particles = particles.filter(p=>p.life>0);
}

// ── Drawing ───────────────────────────────────────────────
function drawSky(lvl) {
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,lvl.sky[0]); g.addColorStop(1,lvl.sky[1]);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

function drawPlatform(p) {
  ctx.fillStyle=p.c||'#5d4037'; ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle='rgba(255,255,255,0.2)'; ctx.fillRect(p.x,p.y,p.w,3);
  ctx.fillStyle='rgba(0,0,0,0.25)';     ctx.fillRect(p.x,p.y+p.h-3,p.w,3);
}

function drawSpikes(s) {
  ctx.fillStyle='#FF3333';
  for (let i=0;i<s.n;i++) {
    const bx=s.x+i*SW;
    ctx.beginPath(); ctx.moveTo(bx,s.y); ctx.lineTo(bx+SW/2,s.y-SH); ctx.lineTo(bx+SW,s.y); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle='rgba(255,200,200,0.55)';
  for (let i=0;i<s.n;i++) {
    const bx=s.x+i*SW;
    ctx.beginPath(); ctx.moveTo(bx+SW*0.35,s.y-SH*0.2); ctx.lineTo(bx+SW/2,s.y-SH+3); ctx.lineTo(bx+SW*0.55,s.y-SH*0.2); ctx.closePath(); ctx.fill();
  }
}

function drawEnemy(e) {
  if (!e.alive) return;
  const cx=e.x+e.w/2, top=e.y;
  ctx.strokeStyle='#c0392b'; ctx.lineWidth=2.5; ctx.lineCap='round';
  ctx.fillStyle='#e74c3c';
  ctx.beginPath(); ctx.arc(cx,top+7,7,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.strokeStyle='#7b0000'; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(cx-6,top+3); ctx.lineTo(cx-2,top+6);
  ctx.moveTo(cx+6,top+3); ctx.lineTo(cx+2,top+6);
  ctx.stroke();
  ctx.fillStyle='#500';
  ctx.beginPath(); ctx.arc(cx-3,top+7,2,0,Math.PI*2); ctx.arc(cx+3,top+7,2,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#c0392b'; ctx.lineWidth=2.5;
  ctx.beginPath();
  ctx.moveTo(cx,top+14); ctx.lineTo(cx,top+22);
  ctx.moveTo(cx-9,top+17); ctx.lineTo(cx+9,top+17);
  ctx.moveTo(cx,top+22); ctx.lineTo(cx-6,top+30);
  ctx.moveTo(cx,top+22); ctx.lineTo(cx+6,top+30);
  ctx.stroke();
}

function drawGoal(g) {
  const px=g.x+8;
  const grd=ctx.createRadialGradient(px,g.y+60,0,px,g.y+60,65);
  grd.addColorStop(0,'rgba(255,215,0,0.22)'); grd.addColorStop(1,'rgba(255,215,0,0)');
  ctx.fillStyle=grd; ctx.fillRect(g.x-55,g.y-10,g.w+110,g.h+20);
  ctx.strokeStyle='#bbb'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(px,g.y+g.h); ctx.lineTo(px,g.y+8); ctx.stroke();
  const t=Date.now()/400;
  ctx.fillStyle='#FFD700';
  ctx.beginPath();
  ctx.moveTo(px,g.y+8);
  ctx.bezierCurveTo(px+15,g.y+13+Math.sin(t)*3, px+15,g.y+20+Math.sin(t+.5)*3, px,g.y+30);
  ctx.fill();
  ctx.fillStyle='#FF6600'; ctx.font='bold 12px Arial'; ctx.fillText('★',px+2,g.y+24);
  ctx.fillStyle='rgba(255,215,0,0.85)'; ctx.font='bold 11px Arial';
  ctx.textAlign='center'; ctx.fillText('ZIEL',px,g.y+g.h+14); ctx.textAlign='left';
}

function drawStickFigure(px, py, p) {
  const cx = px + PW/2;

  // Squash/stretch: landSquish compresses vertically, jumpStretch elongates
  const sy = 1 + p.jumpStretch * 0.28 - p.landSquish * 0.30;
  const sx = 1 - p.jumpStretch * 0.16 + p.landSquish * 0.22;

  // Apply transform: anchor at feet center, lean + squash/stretch
  ctx.save();
  ctx.translate(cx, py + PH);
  ctx.rotate(p.lean);
  ctx.scale(sx, sy);
  ctx.translate(-cx, -(py + PH));

  const headR  = 9;
  const headCY = py + headR;
  const neck   = py + headR * 2;
  const waist  = py + headR * 2 + 14;
  const footY  = py + PH;

  // Shadow (not affected by transform, drawn after restore)
  // (done below)

  // Leg swing via sine wave — smooth continuous motion
  const swing = p.dead ? 0 : Math.sin(p.walkCycle) * 14;

  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.lineWidth = p.dead ? 2 : 2.5;
  ctx.strokeStyle = p.dead ? '#ff4444' : '#111';

  // Legs — opposite phase
  ctx.beginPath();
  ctx.moveTo(cx, waist); ctx.lineTo(cx - 8 + swing,     footY);
  ctx.moveTo(cx, waist); ctx.lineTo(cx + 8 - swing,     footY);
  ctx.stroke();

  // Body
  ctx.beginPath(); ctx.moveTo(cx, neck); ctx.lineTo(cx, waist); ctx.stroke();

  // Arms — counter-swing to legs (opposite phase = +π)
  const armSwing = Math.sin(p.walkCycle + Math.PI) * 10;
  ctx.beginPath();
  ctx.moveTo(cx, neck+4); ctx.lineTo(cx - 11*p.facing + armSwing*0.4, waist-4);
  ctx.moveTo(cx, neck+4); ctx.lineTo(cx + 11*p.facing - armSwing*0.4, waist-4);
  ctx.stroke();

  // Head
  ctx.fillStyle = p.dead ? '#ff8888' : '#fff';
  ctx.beginPath(); ctx.arc(cx, headCY, headR, 0, Math.PI*2);
  ctx.fill(); ctx.stroke();

  if (p.dead) {
    ctx.lineWidth=1.8;
    ctx.beginPath();
    ctx.moveTo(cx-5,headCY-3); ctx.lineTo(cx-2,headCY);
    ctx.moveTo(cx-2,headCY-3); ctx.lineTo(cx-5,headCY);
    ctx.moveTo(cx+2,headCY-3); ctx.lineTo(cx+5,headCY);
    ctx.moveTo(cx+5,headCY-3); ctx.lineTo(cx+2,headCY);
    ctx.stroke();
  } else {
    // Eye
    ctx.fillStyle='#111';
    ctx.beginPath(); ctx.arc(cx+p.facing*3, headCY-1, 2, 0, Math.PI*2); ctx.fill();
    // Mouth (open when jumping, smile otherwise)
    ctx.lineWidth=1.5;
    if (!p.onGround && p.vy < -2) {
      ctx.fillStyle='#333';
      ctx.beginPath(); ctx.arc(cx+p.facing*2, headCY+3, 2.5, 0, Math.PI); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(cx+p.facing*2, headCY+2, 2.5, 0.1, Math.PI-0.1); ctx.stroke();
    }
  }

  ctx.restore();

  // Shadow — draw outside transform so it stays flat
  if (!p.dead) {
    ctx.fillStyle='rgba(0,0,0,0.13)';
    ctx.beginPath(); ctx.ellipse(cx, py+PH+2, 9*sx, 3, 0, 0, Math.PI*2); ctx.fill();
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life/50;
    ctx.fillStyle   = p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawOverlay(msg, sub, col) {
  ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle=col||'#fff'; ctx.font='bold 52px Segoe UI,Arial'; ctx.fillText(msg,W/2,H/2-18);
  if (sub) { ctx.fillStyle='rgba(255,255,255,0.75)'; ctx.font='22px Segoe UI,Arial'; ctx.fillText(sub,W/2,H/2+30); }
  ctx.textAlign='left';
}

function draw() {
  if (!levelData) return;
  const lvl=levelData;
  drawSky(lvl);
  for (const p of [...lvl.platforms,...levelMovPlat]) drawPlatform(p);
  for (const s of lvl.spikes) drawSpikes(s);
  drawGoal(lvl.goal);
  for (const e of levelEnemies) drawEnemy(e);

  const blink = player.dead && Math.floor(Date.now()/130)%2===0;
  if (!blink) drawStickFigure(player.x, player.y, player);

  drawParticles();

  // Level badge
  ctx.fillStyle='rgba(0,0,0,0.38)';
  ctx.beginPath(); ctx.roundRect(8,8,140,28,6); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.92)'; ctx.font='bold 14px Segoe UI,Arial';
  ctx.fillText(`Level ${currentLevel} / ${TOTAL_LEVELS}`, 16, 27);

  if (state==='dead')      drawOverlay('Nochmal!','Respawn in Kürze...','#FF7043');
  if (state==='nextLevel') drawOverlay('Level geschafft! 🎉','Nächstes Level lädt...','#FFD700');
  if (state==='win')       drawOverlay('Glückwunsch!','Alle 100 Level gemeistert!  Drücke R','#FFD700');
}

// ── Game loop ─────────────────────────────────────────────
function loop() { update(); draw(); requestAnimationFrame(loop); }

initLevel(1);
loop();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strichmännchen Abenteuer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #fff;
      user-select: none;
    }
    #hud {
      display: flex;
      gap: 30px;
      margin-bottom: 10px;
      font-size: 16px;
      background: rgba(255,255,255,0.08);
      padding: 8px 28px;
      border-radius: 20px;
    }
    #hud .label { opacity: 0.65; font-size: 13px; margin-right: 4px; }
    #hud .val   { font-weight: bold; font-size: 18px; }
    canvas {
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      display: block;
      box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }
    #controls {
      margin-top: 10px;
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      display: flex;
      gap: 20px;
    }
    #controls kbd {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="hud">
    <span><span class="label">Level</span><span class="val" id="lvlDisplay">1 / 50</span></span>
    <span><span class="label">Versuche</span><span class="val" id="tryDisplay">0</span></span>
  </div>
  <canvas id="c" width="800" height="480"></canvas>
  <div id="controls">
    <span><kbd>←</kbd><kbd>→</kbd> Bewegen</span>
    <span><kbd>↑</kbd> / <kbd>Leertaste</kbd> Springen</span>
    <span><kbd>R</kbd> Level neu</span>
  </div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = 800, H = 480;

// ── Physics ──────────────────────────────────────────────
const GRAVITY  = 0.55;
const MAX_FALL = 16;
const JUMP     = -12;
const SPEED    = 2.8;   // reduced from 4.2
const FRICTION = 0.76;

// ── Input ────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyR') { tries = 0; initLevel(currentLevel); }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// ── State ────────────────────────────────────────────────
let state        = 'playing';
let currentLevel = 1;
let tries        = 0;
let particles    = [];
let deathTimer   = 0;

const TOTAL_LEVELS = 50;

// ── Player ───────────────────────────────────────────────
const PW = 22, PH = 42;
const player = { x:0, y:0, vx:0, vy:0, onGround:false, facing:1, step:0, stepTimer:0, dead:false };

// ── Deterministic RNG seeded by level number ─────────────
function mkRng(seed) {
  let s = seed * 747796405 + 2891336453;
  return () => {
    s ^= s << 13; s ^= s >> 17; s ^= s << 5;
    return ((s >>> 0) / 4294967296);
  };
}

// ── Level generator ──────────────────────────────────────
const LEVEL_CACHE = {};

function generateLevel(n) {
  if (LEVEL_CACHE[n]) return LEVEL_CACHE[n];
  const rng = mkRng(n);
  const d = (n - 1) / (TOTAL_LEVELS - 1); // 0 → 1 over 50 levels

  // Background palette per 5-level block
  const skies = [
    ['#87CEEB','#c5eaff'], // 1-5   blue
    ['#FFB347','#ffd68a'], // 6-10  orange
    ['#EF9A9A','#B71C1C'], // 11-15 red
    ['#CE93D8','#4A148C'], // 16-20 purple
    ['#80CBC4','#004D40'], // 21-25 teal
    ['#A5D6A7','#1B5E20'], // 26-30 green
    ['#FFCC80','#E65100'], // 31-35 amber
    ['#F48FB1','#880E4F'], // 36-40 pink
    ['#80DEEA','#006064'], // 41-45 cyan
    ['#B39DDB','#1A237E'], // 46-50 indigo-dark
  ];
  const sky = skies[Math.min(Math.floor((n-1)/5), skies.length-1)];

  const platforms   = [];
  const spikes      = [];
  const enemies     = [];
  const movingPlats = [];

  // Ground tiles at start and end always exist
  const startGW = 130;
  const endGX   = 700;
  platforms.push({x:0,     y:440, w:startGW,       h:40, c:'#5d4037'});
  platforms.push({x:endGX, y:440, w:W - endGX,     h:40, c:'#5d4037'});

  // Platform chain parameters (scale with difficulty)
  const chainCount = 3 + Math.floor(d * 11);   // 3 → 14
  const minGap     = 28 + d * 20;              // 28 → 48
  const maxGap     = 55 + d * 55;              // 55 → 110 (max safe jump ≈120px)
  const minPW      = Math.max(38, 110 - d*65); // 110 → 45
  const maxDY      = 40 + d * 70;              // 40 → 110  (max jump height ≈131px)

  let cx = startGW, cy = 400;

  for (let i = 0; i < chainCount; i++) {
    const gap = minGap + rng() * (maxGap - minGap);
    const pw  = minPW  + rng() * 35;
    const dy  = (rng() - 0.45) * maxDY * 2;
    const ny  = Math.max(200, Math.min(420, cy + dy));
    const nx  = cx + gap;
    if (nx + pw > endGX - 20) break;
    platforms.push({x: nx, y: ny, w: pw, h: 14, c: '#4e342e'});
    cx = nx + pw;
    cy = ny;
  }

  // ── Spikes (from level 5) ────────────────────────────
  if (n >= 5) {
    const groupCount = 1 + Math.floor(d * 6);
    for (let i = 0; i < groupCount; i++) {
      const sx = 110 + Math.floor(rng() * 560);
      if (sx > endGX - 10) continue;
      const sn = 1 + Math.floor(rng() * Math.min(d * 5 + 1, 5));
      // avoid first 80px (start area)
      if (sx < 80) continue;
      spikes.push({x: sx, y: 440, n: sn});
    }
  }

  // ── Enemies (from level 7) ───────────────────────────
  if (n >= 7) {
    const midPlats = platforms.filter(p => p.h === 14 && p.w >= 55);
    const eCount   = Math.min(1 + Math.floor((n - 7) / 4), 7);
    const placed   = new Set();
    for (let i = 0; i < eCount; i++) {
      if (midPlats.length === 0) break;
      const pi  = Math.floor(rng() * midPlats.length);
      if (placed.has(pi)) continue;
      placed.add(pi);
      const p   = midPlats[pi];
      const spd = 1.0 + d * 3.2;
      enemies.push({
        x: p.x + 5, y: p.y - 30, w: 26, h: 30,
        vx: (rng() > 0.5 ? 1 : -1) * spd,
        minX: p.x, maxX: p.x + p.w - 26, alive: true,
      });
    }
  }

  // ── Moving platforms (from level 9) ─────────────────
  if (n >= 9) {
    const mCount = Math.min(1 + Math.floor((n - 9) / 5), 5);
    for (let i = 0; i < mCount; i++) {
      const mx  = 160 + Math.floor(rng() * 500);
      const my  = 200 + Math.floor(rng() * 180);
      const spd = 1.2 + d * 2.8;
      const vert = n >= 22 && rng() > 0.55;
      movingPlats.push({
        x: mx, y: my, w: 70, h: 14,
        vx: vert ? 0 : spd * (rng() > 0.5 ? 1 : -1),
        vy: vert ? spd * (rng() > 0.5 ? 1 : -1) : 0,
        minX: mx - 80, maxX: mx + 80,
        minY: my - 80, maxY: my + 80,
        c: '#bf360c',
      });
    }
  }

  const lvl = {
    sky, platforms, spikes, enemies,
    movingPlatforms: movingPlats,
    goal:  {x: 752, y: 310, w: 24, h: 130},
    start: {x: 30,  y: 395},
  };
  LEVEL_CACHE[n] = lvl;
  return lvl;
}

// ── Working copies ────────────────────────────────────────
let levelData    = null;
let levelEnemies = [];
let levelMovPlat = [];

// ── Helpers ───────────────────────────────────────────────
function overlap(ax,ay,aw,ah,bx,by,bw,bh){
  return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by;
}
function spawnParticles(x,y,col,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=1+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:28+Math.random()*22,col});
  }
}

// ── Init level ────────────────────────────────────────────
function initLevel(n) {
  const lvl   = generateLevel(n);
  levelData   = lvl;
  levelEnemies = lvl.enemies.map(e => ({...e}));
  levelMovPlat = lvl.movingPlatforms.map(p => ({...p}));
  particles    = [];
  deathTimer   = 0;

  player.x       = lvl.start.x;
  player.y       = lvl.start.y;
  player.vx      = player.vy = 0;
  player.onGround = false;
  player.dead    = false;
  player.facing  = 1;
  player.step    = player.stepTimer = 0;

  state = 'playing';
  updateHUD();
}

function updateHUD() {
  document.getElementById('lvlDisplay').textContent = `${currentLevel} / ${TOTAL_LEVELS}`;
  document.getElementById('tryDisplay').textContent  = tries;
}

// ── Death / next level ────────────────────────────────────
function die() {
  if (player.dead) return;
  player.dead = true;
  tries++;
  updateHUD();
  spawnParticles(player.x+PW/2, player.y+PH/2, '#ff4444', 16);
  state = 'dead';
  deathTimer = 90; // frames until respawn
}

function completeLevel() {
  spawnParticles(levelData.goal.x+12, levelData.goal.y+50, '#FFD700', 32);
  state = 'nextLevel';
  setTimeout(() => {
    if (currentLevel >= TOTAL_LEVELS) { state = 'win'; return; }
    currentLevel++;
    tries = 0;
    initLevel(currentLevel);
  }, 1800);
}

// ── Spike hitboxes ────────────────────────────────────────
const SW = 18, SH = 20;
function spikeBoxes(s) {
  const out = [];
  for (let i=0; i<s.n; i++) out.push({x:s.x+i*SW, y:s.y-SH, w:SW, h:SH});
  return out;
}

// ── Update ────────────────────────────────────────────────
function update() {
  // Death delay before respawn
  if (state === 'dead') {
    deathTimer--;
    if (deathTimer <= 0) initLevel(currentLevel);
    return;
  }
  if (state !== 'playing') return;

  const lvl = levelData;

  // Input
  if      (keys['ArrowLeft']  || keys['KeyA']) { player.vx = -SPEED; player.facing = -1; }
  else if (keys['ArrowRight'] || keys['KeyD']) { player.vx =  SPEED; player.facing =  1; }
  else    { player.vx *= FRICTION; }

  if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && player.onGround) {
    player.vy = JUMP;
    player.onGround = false;
  }

  player.vy = Math.min(player.vy + GRAVITY, MAX_FALL);
  player.x += player.vx;
  player.y += player.vy;

  // Walk animation
  if (player.onGround && Math.abs(player.vx) > 0.4) {
    if (++player.stepTimer > 9) { player.stepTimer=0; player.step=(player.step+1)%4; }
  } else {
    player.step = player.onGround ? 0 : 1;
  }

  // Moving platforms
  for (const p of levelMovPlat) {
    const px0 = p.x, py0 = p.y;
    if (p.vx) { p.x += p.vx; if (p.x<=p.minX||p.x+p.w>=p.maxX) p.vx=-p.vx; }
    if (p.vy) { p.y += p.vy; if (p.y<=p.minY||p.y+p.h>=p.maxY) p.vy=-p.vy; }
    // Carry player
    if (player.onGround &&
        player.x+PW > px0 && player.x < px0+p.w &&
        Math.abs((player.y+PH) - py0) < 5) {
      player.x += p.x - px0;
      player.y += p.y - py0;
    }
  }

  // Platform collision
  player.onGround = false;
  const allPlats = [...lvl.platforms, ...levelMovPlat];
  for (const p of allPlats) {
    if (!overlap(player.x,player.y,PW,PH, p.x,p.y,p.w,p.h)) continue;
    const ol = (player.x+PW)-p.x, or_ = (p.x+p.w)-player.x;
    const ot = (player.y+PH)-p.y, ob  = (p.y+p.h)-player.y;
    const mn = Math.min(ol,or_,ot,ob);
    if      (mn===ot && player.vy>=0)  { player.y=p.y-PH;   player.vy=0; player.onGround=true; }
    else if (mn===ob && player.vy<0)   { player.y=p.y+p.h;  player.vy=0; }
    else if (mn===ol)                  { player.x=p.x-PW;   player.vx=0; }
    else                               { player.x=p.x+p.w;  player.vx=0; }
  }

  if (player.x < 0)    { player.x=0;    player.vx=0; }
  if (player.x+PW > W) { player.x=W-PW; player.vx=0; }

  // Spikes
  for (const s of lvl.spikes)
    for (const b of spikeBoxes(s))
      if (overlap(player.x+3,player.y+6,PW-6,PH-6, b.x,b.y,b.w,b.h)) { die(); return; }

  // Enemies
  for (const e of levelEnemies) {
    if (!e.alive) continue;
    e.x += e.vx;
    if (e.x<=e.minX||e.x+e.w>=e.maxX) e.vx=-e.vx;
    if (overlap(player.x+2,player.y+2,PW-4,PH-4, e.x,e.y,e.w,e.h)) {
      if (player.vy > 0 && player.y+PH < e.y+e.h*0.55+4) {
        e.alive=false; player.vy=JUMP*0.55;
        spawnParticles(e.x+e.w/2, e.y+e.h/2,'#FF5722',12);
      } else { die(); return; }
    }
  }

  // Goal
  const g = lvl.goal;
  if (overlap(player.x,player.y,PW,PH, g.x,g.y,g.w,g.h)) completeLevel();

  // Fall out
  if (player.y > H+80) die();

  // Particles
  for (const p of particles) { p.x+=p.vx; p.y+=p.vy; p.vy+=0.18; p.life--; }
  particles = particles.filter(p=>p.life>0);
}

// ── Drawing ───────────────────────────────────────────────
function drawSky(lvl) {
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,lvl.sky[0]);
  g.addColorStop(1,lvl.sky[1]);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

function drawPlatform(p) {
  ctx.fillStyle = p.c||'#5d4037';
  ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle='rgba(255,255,255,0.2)'; ctx.fillRect(p.x,p.y,p.w,3);
  ctx.fillStyle='rgba(0,0,0,0.25)';     ctx.fillRect(p.x,p.y+p.h-3,p.w,3);
}

function drawSpikes(s) {
  ctx.fillStyle='#FF3333';
  for(let i=0;i<s.n;i++){
    const bx=s.x+i*SW;
    ctx.beginPath(); ctx.moveTo(bx,s.y); ctx.lineTo(bx+SW/2,s.y-SH); ctx.lineTo(bx+SW,s.y); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle='rgba(255,200,200,0.55)';
  for(let i=0;i<s.n;i++){
    const bx=s.x+i*SW;
    ctx.beginPath(); ctx.moveTo(bx+SW*0.35,s.y-SH*0.2); ctx.lineTo(bx+SW/2,s.y-SH+3); ctx.lineTo(bx+SW*0.55,s.y-SH*0.2); ctx.closePath(); ctx.fill();
  }
}

function drawEnemy(e) {
  if (!e.alive) return;
  const cx=e.x+e.w/2, top=e.y;
  ctx.strokeStyle='#c0392b'; ctx.lineWidth=2.5; ctx.lineCap='round';
  ctx.fillStyle='#e74c3c';
  ctx.beginPath(); ctx.arc(cx,top+7,7,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.strokeStyle='#7b0000'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(cx-6,top+3); ctx.lineTo(cx-2,top+6); ctx.moveTo(cx+6,top+3); ctx.lineTo(cx+2,top+6); ctx.stroke();
  ctx.fillStyle='#500'; ctx.beginPath(); ctx.arc(cx-3,top+7,2,0,Math.PI*2); ctx.arc(cx+3,top+7,2,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#c0392b'; ctx.lineWidth=2.5;
  ctx.beginPath();
  ctx.moveTo(cx,top+14); ctx.lineTo(cx,top+22);
  ctx.moveTo(cx-9,top+17); ctx.lineTo(cx+9,top+17);
  ctx.moveTo(cx,top+22); ctx.lineTo(cx-6,top+30);
  ctx.moveTo(cx,top+22); ctx.lineTo(cx+6,top+30);
  ctx.stroke();
}

function drawGoal(g) {
  const px=g.x+8;
  const grd=ctx.createRadialGradient(px,g.y+60,0,px,g.y+60,65);
  grd.addColorStop(0,'rgba(255,215,0,0.22)'); grd.addColorStop(1,'rgba(255,215,0,0)');
  ctx.fillStyle=grd; ctx.fillRect(g.x-55,g.y-10,g.w+110,g.h+20);
  ctx.strokeStyle='#bbb'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(px,g.y+g.h); ctx.lineTo(px,g.y+8); ctx.stroke();
  const t=Date.now()/400;
  ctx.fillStyle='#FFD700';
  ctx.beginPath();
  ctx.moveTo(px,g.y+8); ctx.bezierCurveTo(px+15,g.y+13+Math.sin(t)*3,px+15,g.y+20+Math.sin(t+.5)*3,px,g.y+30); ctx.fill();
  ctx.fillStyle='#FF6600'; ctx.font='bold 12px Arial'; ctx.fillText('★',px+2,g.y+24);
  ctx.fillStyle='rgba(255,215,0,0.85)'; ctx.font='bold 11px Arial'; ctx.textAlign='center'; ctx.fillText('ZIEL',px,g.y+g.h+14); ctx.textAlign='left';
}

function drawStickFigure(px,py,step,facing,dead) {
  const cx=px+PW/2, headR=9;
  const headCY=py+headR, neck=py+headR*2, waist=py+headR*2+14, footY=py+PH;
  if (!dead) {
    ctx.fillStyle='rgba(0,0,0,0.12)';
    ctx.beginPath(); ctx.ellipse(cx,py+PH+2,9,3,0,0,Math.PI*2); ctx.fill();
  }
  const swing = dead ? 0 : [-12,0,12,0][step];
  ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=dead?2:2.5;
  ctx.strokeStyle=dead?'#ff4444':'#111';
  // legs
  ctx.beginPath();
  ctx.moveTo(cx,waist); ctx.lineTo(cx-8+swing*0.7,footY);
  ctx.moveTo(cx,waist); ctx.lineTo(cx+8-swing*0.7,footY);
  ctx.stroke();
  // body
  ctx.beginPath(); ctx.moveTo(cx,neck); ctx.lineTo(cx,waist); ctx.stroke();
  // arms
  const aswing=[8,0,-8,0][step];
  ctx.beginPath();
  ctx.moveTo(cx,neck+4); ctx.lineTo(cx-11*facing-aswing*0.4,waist-4);
  ctx.moveTo(cx,neck+4); ctx.lineTo(cx+11*facing+aswing*0.4,waist-4);
  ctx.stroke();
  // head
  ctx.fillStyle=dead?'#ff8888':'#fff';
  ctx.beginPath(); ctx.arc(cx,headCY,headR,0,Math.PI*2); ctx.fill(); ctx.stroke();
  if (dead) {
    ctx.lineWidth=1.8;
    ctx.beginPath();
    ctx.moveTo(cx-5,headCY-3); ctx.lineTo(cx-2,headCY); ctx.moveTo(cx-2,headCY-3); ctx.lineTo(cx-5,headCY);
    ctx.moveTo(cx+2,headCY-3); ctx.lineTo(cx+5,headCY); ctx.moveTo(cx+5,headCY-3); ctx.lineTo(cx+2,headCY);
    ctx.stroke();
  } else {
    ctx.fillStyle='#111';
    ctx.beginPath(); ctx.arc(cx+facing*3,headCY-1,2,0,Math.PI*2); ctx.fill();
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(cx+facing*2,headCY+2,2.5,0.1,Math.PI-0.1); ctx.stroke();
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha=p.life/50; ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawOverlay(msg, sub, col) {
  ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle=col||'#fff'; ctx.font='bold 52px Segoe UI,Arial'; ctx.fillText(msg,W/2,H/2-18);
  if (sub) { ctx.fillStyle='rgba(255,255,255,0.75)'; ctx.font='22px Segoe UI,Arial'; ctx.fillText(sub,W/2,H/2+30); }
  ctx.textAlign='left';
}

function draw() {
  if (!levelData) return;
  const lvl=levelData;
  drawSky(lvl);
  for (const p of [...lvl.platforms,...levelMovPlat]) drawPlatform(p);
  for (const s of lvl.spikes) drawSpikes(s);
  drawGoal(lvl.goal);
  for (const e of levelEnemies) drawEnemy(e);

  const blink = player.dead && Math.floor(Date.now()/130)%2===0;
  if (!blink) drawStickFigure(player.x,player.y,player.step,player.facing,player.dead);

  drawParticles();

  // Level badge (top-left)
  ctx.fillStyle='rgba(0,0,0,0.38)';
  ctx.beginPath(); ctx.roundRect(8,8,130,28,6); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.92)'; ctx.font='bold 14px Segoe UI,Arial';
  ctx.fillText(`Level ${currentLevel} / ${TOTAL_LEVELS}`,16,27);

  if (state==='dead')      drawOverlay('Nochmal!','Respawn in Kürze...','#FF7043');
  if (state==='nextLevel') drawOverlay('Level geschafft! 🎉','Nächstes Level lädt...','#FFD700');
  if (state==='win')       drawOverlay('Glückwunsch!','Alle 50 Level gemeistert!  Drücke R','#FFD700');
}

// ── Game loop ─────────────────────────────────────────────
function loop() { update(); draw(); requestAnimationFrame(loop); }

initLevel(1);
loop();
</script>
</body>
</html>
